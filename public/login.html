<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log in | Jair Jr. Blog</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			padding: 2rem 1rem;
			display: flex;
			flex-direction: column;
			align-items: center;
			color: #222;
			background: #f4f6f8;
			font-family: system-ui, sans-serif;
		}
		h1 { margin: 0 0 2rem; text-align: center; }
		main {
			width: min(100%, 24rem);
			margin: auto;
			padding: 2rem;
			background: #fff;
			border-radius: 0.75rem;
			box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 8%);
		}
		h2 { margin-top: 0; }
		label { display: block; margin: 1rem 0 0.4rem; }
		input {
			width: 100%;
			padding: 0.75rem;
			border: 1px solid #b8c0c8;
			border-radius: 0.4rem;
			font: inherit;
		}
		button {
			width: 100%;
			margin-top: 1.25rem;
			padding: 0.8rem;
			border: 0;
			border-radius: 0.4rem;
			color: #fff;
			background: #2457c5;
			font: inherit;
			cursor: pointer;
		}
		.recovery { margin: 1rem 0 0; text-align: center; }
	</style>
</head>
<body>
	<h1><a href="/">Blog Jair Junior</a></h1>
	<main>
		<h2>Log in</h2>
		<form action="/login" method="post">
			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" required>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required>

			<button type="submit">Log in</button>
		</form>
		<p class="recovery"><a href="/forgot-password">Forgot your password?</a></p>
	</main>
</body>
</html>
